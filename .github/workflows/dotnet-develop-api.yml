name: CI/CD - ASP.NET + Railway

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restores/builds/tests the whole solution (not just the API csproj) so this
      # workflow's own deploy job is actually gated on tests passing - previously it
      # only built the API project directly, so a push with failing tests (only caught
      # by the separate, independent ci-cd.yml workflow) could still deploy to Railway.
      - name: Restore dependencies
        run: dotnet restore barber-flow-api/Barber.Flow.Api/Barber.Flow.Api.slnx

      - name: Build solution
        run: dotnet build barber-flow-api/Barber.Flow.Api/Barber.Flow.Api.slnx --no-restore --configuration Release

      - name: Test solution
        run: dotnet test barber-flow-api/Barber.Flow.Api/Barber.Flow.Api.slnx --no-build --configuration Release --verbosity normal

  deploy:
    name: Deploy to Railway
    needs: build
    runs-on: ubuntu-latest

    # ⚠️ Solo desplegar en push (NO en PR)
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        # main -> environment de producción, develop -> environment de desarrollo.
        # El environment "production" debe existir en Railway antes de que esto corra en main.
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            RAILWAY_ENVIRONMENT="production"
          else
            RAILWAY_ENVIRONMENT="develop"
          fi
          railway up --service barber.flow.app --environment "$RAILWAY_ENVIRONMENT" --detach
        env:
         # RAILWAY_TOKEN is for project-scoped tokens (locked to one environment); an
         # account/team token that can deploy to multiple environments must be passed as
         # RAILWAY_API_TOKEN instead, or the CLI rejects it as invalid.
         RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
         # A project-scoped token knows its own project automatically; an account token
         # doesn't, so it needs to be told which project to act on or `railway up` fails
         # with "No linked project found" before it ever gets to pick an environment.
         RAILWAY_PROJECT_ID: ebb6ff97-3097-41df-a558-94ef61eae624
