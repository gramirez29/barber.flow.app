name: CI/CD - ASP.NET + Railway

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # Restores/builds/tests the whole solution (not just the API csproj) so this
      # workflow's own deploy job is actually gated on tests passing - previously it
      # only built the API project directly, so a push with failing tests (only caught
      # by the separate, independent ci-cd.yml workflow) could still deploy to Railway.
      - name: Restore dependencies
        run: dotnet restore barber-flow-api/Barber.Flow.Api/Barber.Flow.Api.slnx

      - name: Build solution
        run: dotnet build barber-flow-api/Barber.Flow.Api/Barber.Flow.Api.slnx --no-restore --configuration Release

      - name: Test solution
        run: dotnet test barber-flow-api/Barber.Flow.Api/Barber.Flow.Api.slnx --no-build --configuration Release --verbosity normal

  deploy:
    name: Deploy to Railway
    needs: build
    runs-on: ubuntu-latest

    # ⚠️ Solo desplegar en push (NO en PR)
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        # main -> environment de producción, develop -> environment de desarrollo.
        # El environment "production" debe existir en Railway antes de que esto corra en main.
        # Railway project tokens (Project Settings > Tokens) are locked to ONE environment and must
        # be exposed to the CLI as RAILWAY_TOKEN (RAILWAY_API_TOKEN is only for account/team
        # tokens and answers "Unauthorized" to a project token). Hence one secret per environment,
        # and the one matching the branch is picked here. A project token already knows its
        # project, so no RAILWAY_PROJECT_ID is needed.
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            RAILWAY_ENVIRONMENT="production"
            RAILWAY_TOKEN="$RAILWAY_TOKEN_PRODUCTION"
            TOKEN_SECRET_NAME="RAILWAY_TOKEN_PRODUCTION"
          else
            RAILWAY_ENVIRONMENT="develop"
            RAILWAY_TOKEN="$RAILWAY_TOKEN_DEVELOP"
            TOKEN_SECRET_NAME="RAILWAY_TOKEN_DEVELOP"
          fi

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::The $TOKEN_SECRET_NAME repository secret is empty or missing."
            exit 1
          fi

          export RAILWAY_TOKEN
          railway up --service barber.flow.app --environment "$RAILWAY_ENVIRONMENT" --detach
        env:
          RAILWAY_TOKEN_DEVELOP: ${{ secrets.RAILWAY_TOKEN_DEVELOP }}
          RAILWAY_TOKEN_PRODUCTION: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
