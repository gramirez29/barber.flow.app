version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: barber-flow-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: barberflow_2026
      MONGO_INITDB_DATABASE: barber-flow-db
    volumes:
      - mongodb_data:/data/db
      - ./barber-flow-api/mongo-init:/docker-entrypoint-initdb.d
    networks:
      - barber-flow-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (C# .NET)
  api:
    build:
      context: ./barber-flow-api/Barber.Flow.Api
      dockerfile: Dockerfile
    container_name: barber-flow-api
    restart: always
    ports:
      - "7016:8080"
      - "7017:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - MONGODB_URI=mongodb://admin:barberflow_2026@mongodb:27017/barber-flow-db
      - JWT_SECRET=barber_flow_jwt_secret_2026_production_key
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,https://barber-flow.vercel.app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - barber-flow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend (React)
  web:
    build:
      context: ./barber-flow-web
      dockerfile: Dockerfile
    container_name: barber-flow-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://api:8080
      - VITE_API_TIMEOUT=30000
      - NODE_ENV=production
    depends_on:
      - api
    networks:
      - barber-flow-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
    driver: local

networks:
  barber-flow-network:
    driver: bridge
